services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vg-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vg-net

  routes-db:
    image: postgis/postgis:16-3.4
    container_name: vg-routes-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: routes_db
    volumes:
      - routes_data:/var/lib/postgresql/data
    networks:
      - vg-net

  coldchain-db:
    image: postgres:16
    container_name: vg-coldchain-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: coldchain_db
    volumes:
      - coldchain_data:/var/lib/postgresql/data
    networks:
      - vg-net

  registry-db:
    image: postgres:16
    container_name: vg-registry-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: registry_db
    volumes:
      - registry_data:/var/lib/postgresql/data
    networks:
      - vg-net

  identity-db:
    image: postgres:16
    container_name: vg-identity-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: identity_db
    volumes:
      - identity_data:/var/lib/postgresql/data
    networks:
      - vg-net

  advisor-db:
    image: pgvector/pgvector:pg16
    container_name: vg-advisor-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: advisor_db
    volumes:
      - advisor_data:/var/lib/postgresql/data
    networks:
      - vg-net

  nodered:
    image: nodered/node-red:latest
    container_name: vg-nodered
    restart: unless-stopped
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      TZ: America/Mexico_City
    volumes:
      - nodered_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vg-net

  n8n-db:
    image: postgres:16
    container_name: vg-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n_db
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - vg-net

  n8n:
    image: n8nio/n8n:latest
    container_name: vg-n8n
    restart: unless-stopped
    depends_on:
      - n8n-db
      - rabbitmq
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - vg-net

volumes:
  rabbitmq_data:
  routes_data:
  coldchain_data:
  registry_data:
  identity_data:
  advisor_data:
  nodered_data:
  n8n_db_data:
  n8n_data:


networks:
  vg-net:
    driver: bridge
